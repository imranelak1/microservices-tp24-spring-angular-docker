name: course7-tp24
services:
  mysql:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: smart_house
      MYSQL_USER: smart
      MYSQL_PASSWORD: ${DB_PASSWORD:-smart-lab-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-lab-only}
      MYSQL_INITDB_SKIP_TZINFO: '1'
    ports:
    - 127.0.0.1:13324:3306
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysql --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT
        1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 768m
    command:
    - --performance-schema=OFF
    - --innodb-buffer-pool-size=64M
    - --max-connections=80
  backend:
    build: ./Smart_Home_back
    ports:
    - 127.0.0.1:18024:8085
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_house?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: smart
      DB_PASSWORD: ${DB_PASSWORD:-smart-lab-only}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8085/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 512m
  frontend:
    build: ./smartHome-front
    ports:
    - 127.0.0.1:19024:80
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
  phpmyadmin:
    image: phpmyadmin:5.2.2
    ports:
    - 127.0.0.1:19124:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 192m
volumes:
  mysql_data: null
